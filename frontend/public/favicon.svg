<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Black gradient for depth -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <!-- Subtle inner glow on white shapes -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ── Background: rounded square ── -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>

  <!-- ── Hexagon frame (subtle, low-opacity) ── -->
  <polygon
    points="32,5 54,17.5 54,46.5 32,59 10,46.5 10,17.5"
    fill="none"
    stroke="rgba(255,255,255,0.08)"
    stroke-width="1.2"
  />

  <!-- ── TRUCK BODY ── -->
  <!-- Main cargo box -->
  <rect x="9" y="24" width="28" height="16" rx="2" fill="#ffffff" filter="url(#glow)"/>

  <!-- Truck cab -->
  <path
    d="M37 28.5 L37 40 L52 40 L52 32 L46 28.5 Z"
    fill="#ffffff"
    filter="url(#glow)"
  />

  <!-- Cab windshield (dark cutout) -->
  <path
    d="M38.5 30 L38.5 35.5 L50 35.5 L50 32 L44.5 30 Z"
    fill="#000000"
    opacity="0.85"
  />

  <!-- ── WHEELS ── -->
  <!-- Rear wheel -->
  <circle cx="19" cy="41.5" r="4.5" fill="#000000" stroke="#ffffff" stroke-width="2"/>
  <circle cx="19" cy="41.5" r="1.8" fill="#ffffff"/>

  <!-- Front wheel -->
  <circle cx="45" cy="41.5" r="4.5" fill="#000000" stroke="#ffffff" stroke-width="2"/>
  <circle cx="45" cy="41.5" r="1.8" fill="#ffffff"/>

  <!-- ── SPEED / FLOW LINES (the "Flow" in FleetFlow) ── -->
  <line x1="5"  y1="30" x2="10" y2="30" stroke="#ffffff" stroke-width="2"   stroke-linecap="round" opacity="0.6"/>
  <line x1="4"  y1="34" x2="9"  y2="34" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
  <line x1="5"  y1="38" x2="10" y2="38" stroke="#ffffff" stroke-width="1"   stroke-linecap="round" opacity="0.2"/>

  <!-- ── ROAD / GROUND LINE ── -->
  <line x1="6" y1="47" x2="58" y2="47" stroke="rgba(255,255,255,0.18)" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 3"/>

  <!-- ── LOCATION PIN on top of cargo box ── -->
  <!-- Pin circle -->
  <circle cx="23" cy="20" r="4" fill="#ffffff"/>
  <!-- Pin tail -->
  <path d="M23 24 L20.5 28 L25.5 28 Z" fill="#ffffff"/>
  <!-- Pin inner dot (black) -->
  <circle cx="23" cy="20" r="1.5" fill="#000000"/>
</svg>
